<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冯雪豪 · 个人主页</title>
  <meta name="description" content="冯雪豪的个人主页：前端学习者，正在构建全栈项目。">
</head>
<body>

  <header>
    <h1>冯雪豪</h1>
    <img src="10.26.jpg" alt="冯雪豪的头像" width="120" height="120">
    <nav>
      <a href="#about">关于</a>
      <a href="#skills">技能</a>
      <a href="#contact">联系</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>关于我</h2>
      <p>正在学习前端开发，目标是能独立完成一个全栈项目。</p>
    </section>

    <section id="skills">
      <h2>技能</h2>
      <ul>
        <li>HTML 语义化</li>
        <li>CSS 基础</li>
        <li>Git 版本管理</li>
      </ul>
    </section>

    <section id="contact">
      <h2>联系我</h2>
      <form action="#" method="get">
        <p>
          <label for="name">姓名</label>
          <input id="name" name="name" type="text" required>
        </p>
        <p>
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" required>
        </p>
        <p>
          <label for="message">留言</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </p>
        <button type="submit">发送</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 冯雪豪</p>
  </footer>

</body>
</html>
